<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Space Explorer</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="hero">
        <div class="container">
            <p class="eyebrow">Mission Control</p>
            <h1>NASA Space Explorer</h1>
            <p class="subtitle">Discover cosmic imagery, Mars data, and near-earth objects from the NASA API.</p>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Today's Astronomy Picture</h2>
            <div id="apodCard" class="card">
                <div class="loader">Loading...</div>
            </div>
        </section>

        <section class="panel split">
            <div>
                <h2>Mars Rover Photos</h2>
                <div id="marsCard" class="card">
                    <div class="loader">Loading...</div>
                </div>
            </div>
            <div>
                <h2>Near Earth Objects</h2>
                <div id="neoCard" class="card">
                    <div class="loader">Loading...</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function loadData() {
            try {
                const apodRes = await fetch('/api/space/apod');
                const apod = await apodRes.json();
                const apodHtml = `
                    <img src="${apod.url}" alt="${apod.title || 'Astronomy image'}" />
                    <div class="content">
                        <h3>${apod.title || 'Astronomy Picture of the Day'}</h3>
                        <p class="meta">${apod.date || ''}</p>
                        <p>${apod.explanation || 'No description available.'}</p>
                    </div>
                `;
                document.getElementById('apodCard').innerHTML = apodHtml;

                const marsRes = await fetch('/api/space/mars-rover?sol=1000&camera=fhaz');
                const mars = await marsRes.json();
                const photos = mars.photos || [];
                const firstPhoto = photos[0];
                const marsHtml = firstPhoto
                    ? `
                        <img src="${firstPhoto.img_src}" alt="Mars rover photo" />
                        <div class="content">
                            <h3>${firstPhoto.camera.full_name}</h3>
                            <p class="meta">Sol ${firstPhoto.sol} • ${firstPhoto.earth_date}</p>
                            <p>Rover: ${firstPhoto.rover.name}</p>
                        </div>
                    `
                    : '<p>No Mars rover data available.</p>';
                document.getElementById('marsCard').innerHTML = marsHtml;

                const neoRes = await fetch('/api/space/neo?start_date=2024-01-01&end_date=2024-01-07');
                const neo = await neoRes.json();
                const asteroids = neo.near_earth_objects ? Object.values(neo.near_earth_objects).flat() : [];
                const topAsteroid = asteroids[0];
                const neoHtml = topAsteroid
                    ? `
                        <div class="content">
                            <h3>${topAsteroid.name}</h3>
                            <p class="meta">Estimated diameter: ${topAsteroid.estimated_diameter.meters.estimated_diameter_max.toFixed(1)} m</p>
                            <p>Closest approach: ${topAsteroid.close_approach_data[0]?.close_approach_date_full || 'N/A'}</p>
                            <p>Hazardous: ${topAsteroid.is_potentially_hazardous_asteroid ? 'Yes' : 'No'}</p>
                        </div>
                    `
                    : '<p>No asteroid data available.</p>';
                document.getElementById('neoCard').innerHTML = neoHtml;
            } catch (error) {
                document.getElementById('apodCard').innerHTML = '<p>Unable to load NASA data. Check your API key.</p>';
                document.getElementById('marsCard').innerHTML = '<p>Unable to load Mars data.</p>';
                document.getElementById('neoCard').innerHTML = '<p>Unable to load asteroid data.</p>';
            }
        }

        loadData();
    </script>
</body>
</html>
